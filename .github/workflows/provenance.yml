name: Build provenance — guild-commerce

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    name: Governance policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3
      - run: python .bits/checks/verify_governance.py

  build:
    name: Provenance build
    needs: governance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Pack compiled distribution
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.js
          mkdir -p "$RUNNER_TEMP/commerce-package/dist" "$RUNNER_TEMP/commerce-artifacts"
          cp -R dist/. "$RUNNER_TEMP/commerce-package/dist/"
          cp package.json "$RUNNER_TEMP/commerce-package/"
          npm pack "$RUNNER_TEMP/commerce-package" --ignore-scripts \
            --pack-destination "$RUNNER_TEMP/commerce-artifacts"
      - name: Retain build archive
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: commerce-build-${{ github.sha }}
          path: ${{ runner.temp }}/commerce-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Sign build provenance
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'citadel-nexus/guild-commerce'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download this run's immutable build artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/commerce-artifacts
          merge-multiple: true
      - name: Sign SLSA provenance for the archive
        id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ runner.temp }}/commerce-artifacts/*.tgz
      - name: Retain verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: commerce-provenance-${{ github.sha }}
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
